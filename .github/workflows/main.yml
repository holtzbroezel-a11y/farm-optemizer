name: FarmLagFix bauen

on:
  push:
    paths:
      - 'farmlagfix/**'
      - '.github/workflows/farmlagfix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: farmlagfix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: farmlagfix-jar
          path: |
            farmlagfix/build/libs/farmlagfix-*.jar
            !farmlagfix/build/libs/*-sources.jar
            
